name: deploy
# owner 26 Nov: the website goes live from GitHub (free): tests -> build -> database migration -> the "www" worker -> the
# news360-tn.pages.dev address. Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   (permissions: Workers Scripts Edit, D1 Edit, Cloudflare Pages Edit - Account level)
#   CLOUDFLARE_ACCOUNT_ID
# Cloudflare free plan only: nothing here is paid.
on:
  push:
    branches: [main]
    paths: ["src/**", "db/**", "public/**", "pages/**", "package.json", "package-lock.json", "astro.config.mjs", "wrangler.jsonc", ".github/workflows/deploy.yml"]
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Cloudflare secrets present?
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Deploy skipped - add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see the top of this file), then run this workflow again"
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else echo "ready=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.cf.outputs.ready == 'yes'
        with: { node-version: "24", cache: npm }
      - run: npm ci --no-audit --no-fund
        if: steps.cf.outputs.ready == 'yes'
      - run: npm test
        if: steps.cf.outputs.ready == 'yes'
      - run: npm run build
        if: steps.cf.outputs.ready == 'yes'
      - name: Database (adds only new columns/tables - never deletes news)
        if: steps.cf.outputs.ready == 'yes'
        run: npx wrangler d1 migrations apply namakkal360 --remote
      - name: Website worker (www)
        if: steps.cf.outputs.ready == 'yes'
        run: npx wrangler deploy
      - name: Public address (news360-tn.pages.dev)
        if: steps.cf.outputs.ready == 'yes'
        run: |
          # deployed from a clean copy outside the repository: the build leaves .wrangler/deploy/config.json behind, which makes
          # wrangler stop with "found both wrangler.jsonc and .wrangler/deploy/config.json"
          WR="$GITHUB_WORKSPACE/node_modules/.bin/wrangler"
          rm -rf "$RUNNER_TEMP/pagesdeploy" && cp -r pages "$RUNNER_TEMP/pagesdeploy" && cd "$RUNNER_TEMP/pagesdeploy"
          "$WR" pages project create news360-tn --production-branch main 2>/dev/null || true
          "$WR" pages deploy . --project-name news360-tn --branch main --commit-dirty=true
      - name: Public address answers?
        if: steps.cf.outputs.ready == 'yes'
        run: |
          code=000
          for i in 1 2 3 4 5 6; do code=$(curl -s -o /dev/null -w "%{http_code}" https://news360-tn.pages.dev/ || true); [ "$code" = 200 ] && break; sleep 10; done
          echo "https://news360-tn.pages.dev/ answered $code"
          [ "$code" = 200 ] || { echo "::error::news360-tn.pages.dev did not answer 200 - open Cloudflare > Workers & Pages > news360-tn and check its domain (it may carry a suffix if the name was taken)"; exit 1; }
