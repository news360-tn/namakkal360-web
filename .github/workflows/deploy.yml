name: deploy
# owner 26 Nov: the website goes live from GitHub (free): tests -> build -> database migration -> the "www" worker -> the
# news360.pages.dev address. Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   (permissions: Workers Scripts Edit, D1 Edit, Cloudflare Pages Edit - Account level)
#   CLOUDFLARE_ACCOUNT_ID
# Cloudflare free plan only: nothing here is paid.
on:
  push:
    branches: [main]
    paths: ["src/**", "db/**", "public/**", "pages/**", "package.json", "package-lock.json", "astro.config.mjs", "wrangler.jsonc", ".github/workflows/deploy.yml"]
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Cloudflare secrets present?
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see the comment at the top of this file)"; exit 1; fi
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Database (adds only new columns/tables - never deletes news)
        run: npx wrangler d1 migrations apply namakkal360 --remote
      - name: Website worker (www)
        run: npx wrangler deploy
      - name: Public address (news360.pages.dev)
        run: |
          cd pages
          ../node_modules/.bin/wrangler pages project create news360 --production-branch main 2>/dev/null || true
          ../node_modules/.bin/wrangler pages deploy . --project-name news360 --branch main --commit-dirty=true
