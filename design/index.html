"RN-138": "https://res.cloudinary.com/bgk9wm1u/image/upload/c_crop,g_north,w_1.0,h_0.34,y_0.6/w_720/v1793064831/news360/gw53vdjcngg6tsucglme.jpg",
"RN-137": "https://res.cloudinary.com/bgk9wm1u/image/upload/c_crop,g_north,w_1.0,h_0.34,y_0.6/w_720/v1793064890/news360/unuflhzcz3c5z5y3a6tt.jpg",
"RN-130": "https://res.cloudinary.com/bgk9wm1u/image/upload/c_crop,g_north,w_1.0,h_0.34,y_0.6/w_720/v1793047920/news360/cl6qnnh3rc6dsazrro9v.jpg",
"RN-129": "https://res.cloudinary.com/bgk9wm1u/image/upload/c_crop,g_north,w_1.0,h_0.34,y_0.6/w_720/v1793033915/news360/pt5vqdsmv7yradga2zix.jpg",
"RN-124": "https://res.cloudinary.com/bgk9wm1u/image/upload/c_crop,g_north,w_1.0,h_0.34,y_0.6/w_720/v1793029036/news360/yakmmqpfxgmpr3hohol5.jpg",
"RN-118": "https://res.cloudinary.com/bgk9wm1u/image/upload/c_crop,g_north,w_1.0,h_0.34,y_0.6/w_720/v1793033864/news360/rfaivo1hzrkdoxlrdu7b.jpg",
"RN-111": "https://res.cloudinary.com/bgk9wm1u/image/upload/c_crop,g_north,w_1.0,h_0.34,y_0.6/w_720/v1793028944/news360/cc3jckxyfb1cizgfjuan.jpg"
};
const TX = {
 ta:{brand:"நாமக்கல்",searchPh:"செய்தி அல்லது ஊர் தேடுங்கள்",all:"அனைத்தும்",district:"நாமக்கல் மாவட்டம்",distSub:"8 தாலுகாக்கள் · அனைத்து ஊர் செய்திகள்",allOf:"முழு",
   latest:"சமீபத்திய செய்திகள்",n:"செய்திகள்",clear:"அனைத்தும் காட்டு",empty:"இந்தத் தேர்வில் செய்தி இல்லை.",anyDate:"எல்லா நாளும்",today:"இன்று",yest:"நேற்று",w:"இந்த வாரம்",pick:"தேதி தேர்வு…",
   power:"மின்தடை அறிவிப்பு",place:"இடம்",mine:"என் பகுதி",setMine:"என் பகுதியாக வை",share:"WhatsApp-ல் பகிர்",reel:"ரீல் பார்க்க",about:"நாமக்கல் மாவட்டத்தின் அனைத்து ஊர் செய்திகளும் - தமிழிலும் ஆங்கிலத்திலும்."},
 en:{brand:"Namakkal",searchPh:"Search news or town",all:"All",district:"Namakkal District",distSub:"8 taluks · news from every town",allOf:"All of",
   latest:"Latest news",n:"stories",clear:"Show all",empty:"No news for this choice.",anyDate:"Any day",today:"Today",yest:"Yesterday",w:"This week",pick:"Pick a date…",
   power:"Power cut notice",place:"Place",mine:"My area",setMine:"Set as my area",share:"Share on WhatsApp",reel:"Watch reel",about:"News from every town in Namakkal district - in Tamil and English."}
};
const TODAY="2026-10-27", S={l:"ta",tk:"",pl:"",ty:"",dt:"any",day:"",q:""};
const $=s=>document.querySelector(s), t=k=>TX[S.l][k], N=o=>o[S.l];
const tk=id=>TALUKS.find(x=>x.id===id), ty=id=>TYPES.find(x=>x.id===id);
const placeOf=n=>{const p=tk(n.tk).places.find(p=>p.id===n.pl);return p?N(p):N(tk(n.tk))};
const ago=d=>Math.round((new Date(TODAY)-new Date(d))/864e5);
const when=n=>(ago(n.d)===0?t("today"):ago(n.d)===1?t("yest"):n.d)+" · "+n.t;
const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;
function chip(label,on,fn,dot){const b=document.createElement("button");b.className="chip";b.setAttribute("aria-pressed",on);b.innerHTML=(dot?`<i class="dot" style="--c:${dot}"></i>`:"")+label;b.onclick=fn;return b}
function list(){return NEWS.filter(n=>(!S.tk||n.tk===S.tk)&&(!S.pl||n.pl===S.pl)&&(!S.ty||n.ty===S.ty)
  &&(S.dt==="any"||(S.dt==="today"&&ago(n.d)===0)||(S.dt==="yest"&&ago(n.d)===1)||(S.dt==="w"&&ago(n.d)<7)||(S.dt==="pick"&&n.d===S.day))
  &&(!S.q||(n.ta+n.en+placeOf(n)).toLowerCase().includes(S.q.toLowerCase())))
  .sort((a,b)=>b.d.localeCompare(a.d)||((ME.seen[b.ty]||0)+(b.tk===ME.area?3:0))-((ME.seen[a.ty]||0)+(a.tk===ME.area?3:0))||b.t.localeCompare(a.t))}

/* reader's interest - kept only in this browser */
const ME={area:"",seen:{}};
try{Object.assign(ME,JSON.parse(localStorage.getItem("n360me")||"{}"))}catch(e){}
const saveMe=()=>{try{localStorage.setItem("n360me",JSON.stringify(ME))}catch(e){}};
const PAGE=6; let shown=PAGE, io;
function reveal(){
  if(io) io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{ if(!e.isIntersecting) return;
    if(e.target.classList.contains("more")){ shown+=PAGE; render(true); } else { e.target.classList.add("show"); io.unobserve(e.target); } }),{rootMargin:"0px 0px 200px 0px"});
  document.querySelectorAll(".card:not(.show),.more").forEach(c=>io.observe(c));
}
function render(keep){
  if(!keep) shown=PAGE;
  document.documentElement.lang=S.l;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===S.l));
  const T=S.tk&&tk(S.tk), [img,cr]=BANNER[S.tk]||BANNER[""];
  $("#bimg").src=img; $("#bcredit").textContent="📷 "+cr;
  $("#btitle").textContent=T?N(T):t("district"); $("#bsub").textContent=T?T.places.map(N).join(" · "):t("distSub");
  const a=$("#taluks"); a.innerHTML=""; a.append(chip(t("all"),!S.tk,()=>set({tk:"",pl:""})));
  [...TALUKS].sort((x,y)=>(y.id===ME.area)-(x.id===ME.area)).forEach(x=>a.append(chip((x.id===ME.area?"⭐ ":"")+N(x),S.tk===x.id,()=>set({tk:S.tk===x.id?"":x.id,pl:""}))));
  const st=$("#star"); st.hidden=!T; if(T){const mine=ME.area===T.id; st.setAttribute("aria-pressed",mine); st.textContent=(mine?"⭐ ":"☆ ")+(mine?t("mine"):t("setMine"));
    st.onclick=()=>{ME.area=mine?"":T.id; saveMe(); render(true)}}
  const p=$("#places"); p.innerHTML=""; p.hidden=!T;
  if(T){p.append(chip(`${t("allOf")} ${N(T)}`,!S.pl,()=>set({pl:""})));T.places.forEach(x=>p.append(chip(N(x),S.pl===x.id,()=>set({pl:S.pl===x.id?"":x.id}))))}
  const y=$("#types"); y.innerHTML=""; y.append(chip(t("all"),!S.ty,()=>set({ty:""})));
  TYPES.forEach(x=>{const b=chip(N(x),S.ty===x.id,()=>set({ty:S.ty===x.id?"":x.id}),x.c);b.style.setProperty("--c",x.c);b.classList.add("tchip");y.append(b)});
  $("#date").innerHTML=[["any",t("anyDate")],["today",t("today")],["yest",t("yest")],["w",t("w")],["pick",t("pick")]].map(([v,l])=>`<option value="${v}" ${S.dt===v?"selected":""}>${l}</option>`).join("");
  $("#pick").hidden=S.dt!=="pick"; $("#pick").value=S.day;
  const L=list(), alerts=L.filter(n=>n.power&&ago(n.d)<=1), rest=L.filter(n=>!alerts.includes(n));
  $("#htitle").textContent=[S.pl?placeOf({tk:S.tk,pl:S.pl}):T?N(T):"",S.ty?N(ty(S.ty)):""].filter(Boolean).join(" · ")||t("latest");
  $("#hcount").textContent=`${L.length} ${t("n")}`; $("#clear").hidden=!(S.tk||S.ty||S.dt!=="any"||S.q);
  $("#alerts").innerHTML=alerts.map(n=>{const[s,e]=n.power,x=v=>((v-6)/16*100).toFixed(1);return `<div class="alert" data-id="${n.id}"><div class="ic">${svg("power")}</div><div style="flex:1">
    <small>${t("power")} · ${placeOf(n)} · ${when(n)}</small><h3>${N({ta:n.ta,en:n.en})}</h3><div class="tb"><span style="left:${x(s)}%;right:${100-x(e)}%"></span></div></div></div>`}).join("");
  const page=rest.slice(0,shown);
  $("#grid").innerHTML=rest.length?page.map(n=>{const c=ty(n.ty);return `<article class="card" data-id="${n.id}" tabindex="0" style="--c:${c.c}">
    <div class="ph" aria-hidden="true">${IMG[n.id]?`<img loading="lazy" src="${IMG[n.id]}" alt="">`:svg(n.ty)}</div><div class="in"><div class="meta"><span class="tag">${N(c)}</span><span>· ${placeOf(n)}</span></div>
    <h3>${N({ta:n.ta,en:n.en})}</h3><time>${when(n)}</time></div></article>`}).join("")+(rest.length>shown?'<div class="more"></div>':""):(alerts.length?"":`<p class="empty">${t("empty")}</p>`);
  document.querySelectorAll("[data-id]").forEach(e=>{e.onclick=()=>openStory(e.dataset.id);e.onkeydown=k=>{if(k.key==="Enter")openStory(e.dataset.id)}});
  if(keep) document.querySelectorAll(".card").forEach((c,i)=>{ if(i<shown-PAGE) c.classList.add("show") });
  reveal();
}
function set(o){Object.assign(S,o);render()}
function openStory(id){
  const n=NEWS.find(x=>x.id===id), c=ty(n.ty), T=N(tk(n.tk)), pn=placeOf(n);
  ME.seen[n.ty]=(ME.seen[n.ty]||0)+1; saveMe();
  const facts=[[t("place"),pn===T?pn:`${pn}, ${T}`],...n.facts.map(f=>[S.l==="ta"?f[0]:f[1],S.l==="ta"?f[2]:f[3]])];
  $("#sheet").innerHTML=`<button class="close" id="x" aria-label="Close">✕</button><div class="ph" style="--c:${c.c}">${IMG[n.id]?`<img src="${IMG[n.id]}" alt="">`:svg(n.ty)}</div><div class="in">
    <div class="meta"><span class="tag" style="--c:${c.c}">${N(c)}</span><span>· ${pn} · ${when(n)}</span></div><h2>${N({ta:n.ta,en:n.en})}</h2>
    <p class="story">${N({ta:n.sta,en:n.sen})}</p><dl class="facts">${facts.map(f=>`<div><dt>${f[0]}</dt><dd>${f[1]}</dd></div>`).join("")}</dl>
    <div class="act"><a class="wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(N({ta:n.ta,en:n.en}))}">${t("share")}</a><a class="ig" target="_blank" rel="noopener" href="https://www.instagram.com/namakkal.360/">▶ ${t("reel")}</a></div></div>`;
  document.body.classList.add("open"); $("#x").onclick=close; $("#x").focus();
}
function close(){document.body.classList.remove("open")}
$("#scrim").onclick=close; addEventListener("keydown",e=>{if(e.key==="Escape")close()});
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{set({l:b.dataset.l});try{localStorage.setItem("n360l",S.l)}catch(e){}});
$("#date").onchange=e=>set({dt:e.target.value,day:e.target.value==="pick"?S.day:""});
$("#pick").onchange=e=>set({day:e.target.value});
$("#clear").onclick=()=>{$("#q").value="";set({tk:"",pl:"",ty:"",dt:"any",day:"",q:""})};
$("#sbtn").onclick=()=>{$("#sbar").classList.toggle("on");$("#q").focus()};
$("#q").oninput=e=>set({q:e.target.value.trim()});
$("#theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=d?"light":"dark";try{localStorage.setItem("n360t",r.dataset.theme)}catch(e){}};
try{const l=localStorage.getItem("n360l");if(l)S.l=l;const th=localStorage.getItem("n360t");if(th)document.documentElement.dataset.theme=th}catch(e){}
const U=new URLSearchParams(location.search);if(["ta","en"].includes(U.get("lang")))S.l=U.get("lang");if(U.get("taluk"))S.tk=U.get("taluk");if(["light","dark"].includes(U.get("theme")))document.documentElement.dataset.theme=U.get("theme");
if(!U.get("taluk")&&ME.area) S.tk=ME.area;      // returning reader: their own area first
addEventListener("scroll",()=>$("#totop").classList.toggle("on",scrollY>600),{passive:true});
$("#totop").onclick=()=>scrollTo({top:0});
render();
</script>
